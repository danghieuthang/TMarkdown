name: Build and Release TMarkdown

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Windows Application
        run: wails build -clean -platform windows/amd64

      - name: Archive Executable to Zip
        shell: pwsh
        run: |
          Compress-Archive -Path "build\bin\TMarkdown.exe" -DestinationPath "build\bin\TMarkdown-windows-x64.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: TMarkdown ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/bin/TMarkdown.exe
            build/bin/TMarkdown-windows-x64.zip
